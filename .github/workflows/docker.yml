name: Create and publish a Docker image

env:
  REGISTRY: ghcr.io

on:
  push:
  schedule:
    - cron: '5 5 1 * *'
  workflow_dispatch:
    inputs:
      dockerimagetag:
        default: latest
        description: Docker image tag
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
      - name: Build and push amd64 (latest + amd64 + timestamp + branch)
        uses: docker/build-push-action@v5
        with:
          build-args: |
            DOCKER_GID=998
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:amd64
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.date.outputs.date }}
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}
      - name: Build and push amd64 (input tag)
        if: ${{ inputs.dockerimagetag }}
        uses: docker/build-push-action@v5
        with:
          build-args: |
            DOCKER_GID=998
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.dockerimagetag }}
      - name: Build and push arm64 (arch64 + arm64 + branch)
        uses: docker/build-push-action@v5
        with:
          build-args: |
            DOCKER_GID=998
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:arch64
            ${{ env.REGISTRY }}/${{ github.repository }}:arm64
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}
